name: Pear Suite
description: >-
  Pear Suite is a care management platform built for community health workers,
  care navigators, doulas, and community-based organizations, describing itself
  as an operating system for community-based work. The platform provides custom
  assessments and care pathways, goal and outcome tracking, patient
  communication over phone, SMS, and encrypted email, client and
  population-level analytics, and billing and claims integration, connecting
  community health initiatives with health plans and health systems. Pear Suite
  reports serving 2,500+ community workers across 300+ organizations nationwide.
